aid: clounix
name: clounix
description: >-
  Clounix (云合智网, Yunhe Zhiwang) is a fabless semiconductor company founded in
  2020 and headquartered in Shanghai, with additional offices in Hangzhou,
  Nanjing, Beijing, and Chengdu. It designs high-end networking and
  communication silicon — high-performance programmable Ethernet switch chips,
  DPUs (Data Processing Units), and SmartNIC intelligent network cards — along
  with cloud-native infrastructure hardware and customized software for data
  centers and 5G networks. Its switch platforms run the open-source SONiC
  network operating system, and the company maintains a public GitHub
  organization with SONiC/SAI networking software. Clounix is a portfolio
  company of Qiming Venture Partners. It currently publishes no public
  developer-facing API, SDK, or documentation portal.
